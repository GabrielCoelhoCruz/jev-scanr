name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run ci
      - run: python3 -m unittest discover -s test -p test_pinned_config.py
      - name: Smoke the packed install (no key)
        run: |
          set -euo pipefail
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          tgz=$(ls "$RUNNER_TEMP"/jev-scanr-*.tgz | head -1)
          smoke="$RUNNER_TEMP/smoke"
          rm -rf "$smoke" && mkdir -p "$smoke"
          cd "$smoke"
          npm init -y >/dev/null
          npm install "$tgz" --ignore-scripts --no-audit --no-fund >/dev/null
          env -u TYPESAFE_API_KEY HOME="$smoke" ./node_modules/.bin/jevs --version
          env -u TYPESAFE_API_KEY HOME="$smoke" ./node_modules/.bin/jevs demo >/dev/null
          echo "packed install ran --version and demo without TYPESAFE_API_KEY"
